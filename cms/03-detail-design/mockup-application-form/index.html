<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT投資 申請画面（紙芝居）</title>
<style>
:root{--teal:#0E5A66;--teal-d:#0E3F48;--ink:#1E2226;--muted:#555B61;--line:#E3E1DB;--soft:#F3F2EE;--bg:#E7E5DF;--red:#B42318;--ai:#4A3A86;--ai-bg:#EFEBF8;--amber:#7A5200;--amber-bg:#FFF3D6}
*{box-sizing:border-box}
body{margin:0;font-family:"BIZ UDPGothic","Meiryo UI","Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
input,select,textarea,button{font-family:inherit;font-size:14px}
input[type=text],select,textarea{border:1px solid #B9BDC2;border-radius:6px;padding:8px 10px;background:#fff;color:var(--ink);width:100%;min-height:38px}
textarea{resize:vertical;line-height:1.6}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
button{cursor:pointer}button:disabled{cursor:not-allowed}
.wrap{display:flex;min-height:100vh}
.app{flex:1;min-width:0;max-width:1080px;display:flex;flex-direction:column;background:#fff;position:relative;height:100vh;box-shadow:0 0 0 1px #D3D0C8}
.hdr{height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:var(--teal-d);color:#fff}
.hdr .name{font-size:17px;font-weight:700;letter-spacing:.04em}.hdr .sub{font-size:12px;color:#A9C9CF}
.btn-ghost{height:34px;padding:0 14px;border-radius:6px;border:1px solid #7FA9B1;background:transparent;color:#fff;font-size:13px}
.stepper{height:52px;flex-shrink:0;display:flex;align-items:center;gap:6px;padding:0 28px;border-bottom:1px solid var(--line);background:#FAF9F6}
.dot{width:24px;height:24px;border-radius:12px;font-size:12px;display:flex;align-items:center;justify-content:center;background:#E7E5DF;color:#6B7177}
.dot.cur{background:var(--teal);color:#fff}.dot.done{background:#CFE3E6;color:#0E4A54}
.slabel{font-size:13px;color:#6B7177}.slabel.cur{font-weight:700;color:var(--ink)}
.sline{width:28px;height:1px;background:#C9C6BE;margin:0 6px}
.body{flex:1;overflow-y:auto;padding:28px 40px 40px}
h1{margin:0;font-size:22px}h2{margin:0;font-size:17px}
.lead{margin:6px 0 0;font-size:13px;color:var(--muted)}
.col{display:flex;flex-direction:column;gap:22px}
.field{display:flex;flex-direction:column;gap:6px}
.flabel{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flabel label{font-size:13px;font-weight:700}
.req{font-size:11px;color:var(--red)}
.hint{font-size:11px;color:#6B7177}.src{font-size:11px;color:#5A4A96}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px}
.b-ai{background:var(--ai-bg);color:var(--ai)}.b-edited,.b-conflict{background:var(--amber-bg);color:var(--amber)}
.b-user{background:#E2EEF0;color:#0E4A54}.b-empty{background:#F0EFEA;color:#5E646A}.b-missing{background:#FDE8E6;color:#9B1C12}
.err{border-color:#D92D20 !important;background:#FFF8F7 !important}
.pill{height:30px;padding:0 12px;border-radius:999px;font-size:12px;border:1px solid #C9C6BE;background:#fff;color:#2A2F34}
.pill.on{border-color:var(--teal);background:var(--teal);color:#fff}
.radio{height:40px;padding:0 18px;border-radius:8px;border:1.5px solid #C9C6BE;background:#fff}
.radio.on{border-color:var(--teal);background:#E2EEF0}
.primary{height:42px;padding:0 24px;border:none;border-radius:8px;font-size:15px;font-weight:700;background:var(--teal);color:#fff}
.primary:disabled{background:#C9CDD1}
.secondary{height:42px;padding:0 20px;border:1px solid #B9BDC2;border-radius:8px;background:#fff}
.outline{height:34px;padding:0 14px;border:1px solid var(--teal);border-radius:6px;background:#fff;color:var(--teal);font-size:13px}
.ftr{height:68px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 40px;border-top:1px solid var(--line);background:#FAF9F6}
.list{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lrow{display:grid;gap:12px;padding:12px 18px;align-items:center;border-top:1px solid var(--line)}
.lrow.head{background:var(--soft);font-size:12px;font-weight:700;color:var(--muted);border-top:none}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px}
.drop{border:1.5px dashed #9FB7BB;border-radius:10px;padding:22px;display:flex;align-items:center;justify-content:space-between;background:#F6FAFA}
.gen{height:46px;padding:0 20px;border-radius:8px;display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:700;border:none;background:#5B3FA6;color:#fff}
.gen:disabled{background:#D9D6CE;color:#7A7F84}
.panel{border-radius:10px;padding:16px 18px}
@keyframes bar{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
.bar{height:6px;border-radius:3px;background:#D9D1EE;overflow:hidden}.bar div{width:40%;height:6px;background:#6A4FB0;animation:bar 1.1s linear infinite}
.review{display:flex;gap:28px;align-items:flex-start}
.toc{width:170px;flex-shrink:0;position:sticky;top:0;display:flex;flex-direction:column;gap:2px;font-size:13px}
.toc a{display:block;padding:7px 10px;border-radius:6px;text-decoration:none;color:#2A2F34}.toc a.miss{color:#9B1C12}.toc a:hover{background:var(--soft)}
.sec{border:1px solid var(--line);border-radius:12px;padding:20px 22px;display:flex;flex-direction:column;gap:18px}
.counts{display:flex;gap:10px;flex-wrap:wrap}.counts div{padding:8px 12px;border-radius:8px;font-size:13px}
.tgrid{display:grid;gap:6px;align-items:center}.tgrid .th{font-size:11px;font-weight:700;color:var(--muted)}
.tgrid input{height:36px;min-height:36px;font-size:13px}
.x{height:36px;border:none;background:transparent;color:#8A9096;font-size:16px}
.addrow{height:32px;padding:0 12px;border:1px dashed #9FB7BB;border-radius:6px;background:#fff;color:var(--teal);font-size:12px}
.conflict{border-radius:8px;padding:12px 14px;background:#FFF7E8;border:1px solid #F0D49A;display:flex;flex-direction:column;gap:8px}
.cand{padding:8px 12px;border-radius:8px;font-size:13px;text-align:left;border:1.5px solid #E0C98F;background:#fff}
.cand.on{border-color:var(--teal);background:#E2EEF0}
.modal{position:absolute;inset:0;background:rgba(20,24,28,.45);display:flex;align-items:center;justify-content:center}
.dialog{width:460px;border-radius:12px;background:#fff;padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.danger{height:40px;padding:0 16px;border:none;border-radius:8px;background:var(--red);color:#fff}
.toast{position:absolute;left:50%;bottom:88px;transform:translateX(-50%);padding:12px 20px;border-radius:8px;background:var(--ink);color:#fff;font-size:13px}
.side{width:380px;flex-shrink:0;height:100vh;overflow-y:auto;padding:28px;display:flex;flex-direction:column;gap:22px}
.jump{text-align:left;padding:9px 12px;border-radius:8px;font-size:13px;border:1px solid #D3D0C8;background:#fff;color:#2A2F34}
.jump.on{border-color:var(--teal);background:var(--teal);color:#fff}
.note{display:flex;gap:10px;font-size:13px;line-height:1.65;color:#2A2F34}
.note .n{flex-shrink:0;width:22px;height:22px;border-radius:11px;background:var(--teal);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center}
.issues{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:10px;background:#FFF7E8}
.kv{display:grid;grid-template-columns:160px minmax(0,1fr);gap:10px 16px;font-size:14px}.kv .k{color:#6B7177}
.sr{position:absolute;left:-9999px}
.lang{display:inline-flex;border:1px solid #7FA9B1;border-radius:6px;overflow:hidden}.lang button{height:32px;padding:0 10px;border:none;background:transparent;color:#D6E6E9;font-size:12px}.lang button.on{background:#fff;color:#0E3F48;font-weight:700}
</style>
</head>

function applyGenerated() {

    if (f.type === 'table' || f.type === 'chips') return;
    if (AI[f.key]) { S.v[f.key] = AI[f.key][0]; o[f.key] = 'ai'; src[f.key] = AI[f.key][1]; } else { S.v[f.key] = ''; o[f.key] = 'empty'; }
  }); });
  S.v.supportEndDate = ''; o.supportEndDate = 'conflict';
  S.t = emptyTables();
  Object.keys(AI_TABLES).forEach(function (k) { S.t[k] = AI_TABLES[k][0].map(function (r) { return r.slice(); }); o[k] = 'ai'; src[k] = AI_TABLES[k][1]; });

function setField(key, val) { S.v[key] = val; var c = S.o[key]; if (c === 'ai' || c === 'edited' || c === 'conflict') S.o[key] = 'edited'; else S.o[key] = val ? 'user' : 'empty'; }

    '.na{color:#8A9096}.foot{margin-top:14pt;font-size:8pt;color:#6B7177}' +
    '</style></head><body><div class="top"><div><div class="stamp">' + T(S.screen === 'done' ? '申請済み' : '下書き（未申請）') + '</div><h1>' + T('案件概要書') + '</h1><div style="font-size:12pt;font-weight:700;margin-top:2pt">' + esc(S.v.title) + '</div></div>' +
    '<div class="meta">' + T('案件ID：[申請時に採番]') + '<br>' + T('出力日時') + (LANG === 'ja' ? '：' : ': ') + ts + '<br>' + T('出力者') + (LANG === 'ja' ? '：' : ': ') + T('[起案担当者 氏名]') + '</div></div>' +
    '<table class="kv"><tr><th>' + T('提案部門') + '</th><td>' + esc(T(S.v.dept)) + '</td></tr><tr><th>' + T('提案責任者') + '</th><td>' + val(S.v.owner) + '</td></tr><tr><th>' + T('審議区分') + '</th><td>' + esc(T(S.v.reviewType)) + '</td></tr><tr><th>' + T('添付資料') + '</th><td>' + files + '</td></tr></table>' +
    body + '<div class="foot">' + T('本書は IT投資 申請画面から出力した。内容は出力時点のもので、申請前は変更される可能性がある。') + '</div>' +
    '<script>window.onload=function(){setTimeout(function(){window.print();},300);};<\/script></body></html>';
}

/* ---------- actions ---------- */
function go(to) {
  if (['review', 'notify', 'confirm', 'done'].indexOf(to) >= 0) ensureGenerated();
  else if (to === 'attach' && !S.files.length) S.files = copyFiles(SAMPLE_FILES.slice(0, 1));
  S.screen = to; S.regen = false; render();
}
function generate() { S.generating = true; rerender(); setTimeout(function () { applyGenerated(); S.generating = false; rerender(); }, 1600); }
var toastTimer;
function toast(msg) { S.toast = msg; rerender(); clearTimeout(toastTimer); toastTimer = setTimeout(function () { S.toast = ''; rerender(); }, 2200); }
var A = {
  lang: function (d) { LANG = d.val; try { localStorage.setItem('cms-mock-lang', LANG); } catch (e) {} rerender(); },
  go: function (d) { go(d.to); },
  back: function () { var i = ORDER.indexOf(S.screen); go(i <= 1 ? 'home' : ORDER[i - 1]); },
  next: function () { var i = ORDER.indexOf(S.screen); go(ORDER[i + 1]); },
  startNew: function () { S.generated = false; S.files = []; S.v = emptyValues(); S.t = emptyTables(); S.chips = { dataCategories: [] }; S.o = {}; S.src = {}; S.recipients = []; S.confirmed = false; S.attachPolicy = ''; go('meta'); },
  draft: function () { toast('下書きを保存しました'); },
  reviewType: function (d) { S.v.reviewType = d.val; rerender(); },
  addFile: function () { var n = SAMPLE_FILES.filter(function (f) { return !S.files.some(function (x) { return x.name === f.name; }); })[0]; if (n) S.files.push({ name: n.name, kind: n.kind }); rerender(); },
  removeFile: function (d) { S.files.splice(+d.i, 1); rerender(); },
  generate: function () { if (S.generated) { S.regen = true; rerender(); } else generate(); },
  cancelRegen: function () { S.regen = false; rerender(); },
  confirmRegen: function () { S.regen = false; generate(); },
  chip: function (d) {
    var cur = S.chips[d.key].slice(), on = cur.indexOf(d.val) >= 0;
    if (d.val === '不明') cur = on ? [] : ['不明'];
    else { cur = cur.filter(function (x) { return x !== '不明'; }); if (on) cur = cur.filter(function (x) { return x !== d.val; }); else cur.push(d.val); }
    S.chips[d.key] = cur; touch(d.key); rerender();
  },
  attachPolicy: function (d) { S.attachPolicy = d.val; rerender(); },
  pick: function (d) { setField(d.key, d.val); rerender(); },
  unk: function (d) {
    if (FIELD[d.key].type === 'table') { if (d.val === '連携なし') S.integrationsNone = !S.integrationsNone; else S.t[d.key] = [[T('不明'), '', '']]; touch(d.key); }
    else setField(d.key, T(d.val));
    rerender();
  },
  addRow: function (d) { S.t[d.key].push(TABLE_COLS[d.key].map(function () { return ''; })); rerender(); },
  delRow: function (d) { S.t[d.key].splice(+d.i, 1); touch(d.key); rerender(); },
  addRecipient: function () { var n = S.newRecipient.trim(); if (n) { S.recipients.push({ name: n, locked: false }); S.newRecipient = ''; } rerender(); },
  addSuggestion: function (d) { S.recipients.push({ name: d.val, locked: false, i18n: true }); rerender(); },
  removeRecipient: function (d) { S.recipients.splice(+d.i, 1); rerender(); },
  pdf: function () { var w = window.open('', '_blank'); if (!w) { toast('ポップアップを許可してください'); return; } w.document.open(); w.document.write(pdfDoc()); w.document.close(); },
  fix: function (d) { var m = missing()[+d.i]; if (!m) return; if (m.sec) { S._scrollTo = m.sec; S.screen = 'review'; render(); } else go(m.to); }
};
var root = document.getElementById('root');
root.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  e.preventDefault(); A[b.dataset.act](b.dataset);
});
root.addEventListener('input', function (e) {
  var t = e.target, d = t.dataset;
  if (d.field) setField(d.field, t.value);
  else if (d.tkey) { S.t[d.tkey][+d.ri][+d.ci] = t.value; touch(d.tkey); }
  else if (d.meta) S.v[d.meta] = t.value;
  else if (t.id === 'newRecipient') S.newRecipient = t.value;
});
root.addEventListener('change', function (e) {
  var t = e.target, d = t.dataset;
  if (t.id === 'confirmed') { S.confirmed = t.checked; return rerender(); }
  if (d.kind != null) { S.files[+d.kind].kind = t.value; return; }
  if (t.tagName === 'SELECT' && d.field) setField(d.field, t.value);
  if (t.tagName === 'SELECT' && d.meta) S.v[d.meta] = t.value;
  if (d.field || d.tkey || d.meta) later();
});
root.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.id === 'newRecipient') { e.preventDefault(); A.addRecipient(); } });
window.__T_KEYS = function () { return EN; };
render();
})();
</script>
</body>
