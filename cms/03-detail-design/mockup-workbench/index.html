<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>審議ワークベンチ（紙芝居）</title>
<style>
:root{--teal:#0E5A66;--teal-d:#16324A;--ink:#1E2226;--muted:#555B61;--line:#E3E1DB;--soft:#F3F2EE;--bg:#E7E5DF;--red:#B42318}
*{box-sizing:border-box}
body{margin:0;font-family:"BIZ UDPGothic","Meiryo UI","Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
input,select,textarea,button{font-family:inherit;font-size:14px}
input[type=text],input[type=datetime-local],select,textarea{border:1px solid #B9BDC2;border-radius:6px;padding:8px 10px;background:#fff;color:var(--ink);width:100%;min-height:38px}
textarea{resize:vertical;line-height:1.6}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
button{cursor:pointer}button:disabled{cursor:not-allowed}
.wrap{display:flex;min-height:100vh}
.app{flex:1;min-width:0;max-width:1100px;display:flex;flex-direction:column;background:#fff;position:relative;height:100vh;box-shadow:0 0 0 1px #D3D0C8}
.hdr{height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:var(--teal-d);color:#fff}
.hdr .name{font-size:17px;font-weight:700;letter-spacing:.04em}
.tabs{display:flex;gap:4px;padding:0 24px;border-bottom:1px solid var(--line);background:#FAF9F6;flex-shrink:0}
.tabs button{border:none;background:transparent;padding:14px 16px;font-size:14px;color:var(--muted);border-bottom:3px solid transparent}
.tabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--teal)}
.body{flex:1;overflow-y:auto;padding:24px 32px 40px}
h1{margin:0;font-size:22px}h2{margin:0;font-size:16px}
.lead{margin:6px 0 0;font-size:13px;color:var(--muted)}
.col{display:flex;flex-direction:column;gap:18px}
.sec{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sec-h{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--soft)}
.sec-h .t{font-weight:700;font-size:14px}.sec-h .n{font-size:12px;color:var(--muted)}
.row{display:grid;gap:12px;padding:11px 16px;align-items:center;border-top:1px solid var(--line);font-size:13px}
.row.link{cursor:pointer}.row.link:hover{background:#F6FAFA}
.row.head{background:#FAF9F6;font-size:12px;font-weight:700;color:var(--muted);border-top:none}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;white-space:nowrap}
.over{color:#9B1C12;font-weight:700}
.empty{padding:18px 16px;font-size:13px;color:#6B7177}
.primary{height:38px;padding:0 18px;border:none;border-radius:8px;font-size:14px;font-weight:700;background:var(--teal);color:#fff}
.primary:disabled{background:#C9CDD1}
.secondary{height:38px;padding:0 16px;border:1px solid #B9BDC2;border-radius:8px;background:#fff}
.act{height:36px;padding:0 14px;border:1px solid var(--teal);border-radius:8px;background:#fff;color:var(--teal);font-size:13px;font-weight:700}
.act.main{background:var(--teal);color:#fff}
.pill{height:30px;padding:0 12px;border-radius:999px;font-size:12px;border:1px solid #C9C6BE;background:#fff;color:#2A2F34}
.pill.on{border-color:var(--teal);background:var(--teal);color:#fff}
.progress{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.progress .st{font-size:12px;padding:4px 10px;border-radius:999px;background:#EEECE7;color:#8A9096}
.progress .st.done{background:#DCEAEC;color:#0E4A54}.progress .st.cur{background:var(--teal);color:#fff;font-weight:700}
.progress .ar{color:#B9BDC2;font-size:11px}
.dtabs{display:flex;gap:2px;border-bottom:1px solid var(--line)}
.dtabs button{border:none;background:transparent;padding:10px 14px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent}
.dtabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--teal)}
.kv{display:grid;grid-template-columns:200px minmax(0,1fr);gap:8px 16px;font-size:13px}.kv .k{color:#6B7177}
.badge{display:inline-block;padding:1px 7px;border-radius:999px;font-size:10.5px;margin-left:6px;vertical-align:1px}
.b-ai{background:#EFEBF8;color:#4A3A86}.b-ed{background:#FFF3D6;color:#7A5200}.b-us{background:#E2EEF0;color:#0E4A54}
.grid7{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:13px}
.grid7>div{padding:9px 12px;border-top:1px solid var(--line)}
.grid7 .gh{background:var(--soft);font-weight:700;font-size:12px;color:var(--muted);border-top:none}
.sel{font-weight:700}.sel.PENDING{color:#9B1C12}.sel.CONFIRMED{color:#1F5B3B}.sel.NA{color:#5E646A}
.note-s{font-size:11.5px;color:#6B7177;margin-top:2px}
.modal{position:absolute;inset:0;background:rgba(20,24,28,.45);display:flex;align-items:center;justify-content:center;z-index:5}
.dialog{width:600px;max-height:88vh;overflow:auto;border-radius:12px;background:#fff;padding:22px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.field{display:flex;flex-direction:column;gap:6px}.field label,.field .l{font-size:13px;font-weight:700}
.hint{font-size:12px;color:#6B7177}
.toast{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);padding:12px 20px;border-radius:8px;background:var(--ink);color:#fff;font-size:13px;z-index:6}
.side{width:360px;flex-shrink:0;height:100vh;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:20px}
.side .h{font-size:12px;font-weight:700;color:#454B51}
.role{text-align:left;padding:9px 12px;border-radius:8px;font-size:13px;border:1px solid #D3D0C8;background:#fff;color:#2A2F34}
.role.on{border-color:var(--teal);background:var(--teal);color:#fff}
.note{display:flex;gap:10px;font-size:13px;line-height:1.65;color:#2A2F34}
.note .n{flex-shrink:0;width:22px;height:22px;border-radius:11px;background:var(--teal);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center}
.sim{padding:12px 14px;border-radius:10px;background:#FFF7E8;display:flex;flex-direction:column;gap:8px}
.sim button{text-align:left;padding:8px 10px;border-radius:8px;border:1px solid #E0C98F;background:#fff;font-size:12.5px}
.sr{position:absolute;left:-9999px}
</style>
</head>

  if (d === 'D6') { title = '委員会へ回答を依頼する'; body = '<p class="hint">起案者の確認完了と、確認表の保留ゼロがそろっています。依頼すると状態が「審議中」になり、委員会メンバーに通知されます。期限：審議 3営業日。</p><div class="field"><label for="txt">依頼の一言（任意）</label><textarea id="txt" rows="2"></textarea></div>'; ok = '依頼する'; }
  if (d === 'D7') { title = '審議結果を登録する'; body = '<div class="field"><span class="l">判定</span>' + [['APPROVE','承認'],['APPROVE_WITH_CONDITIONS','条件付き承認'],['REJECT','非承認']].map(function (o, i) { return '<label style="font-size:14px;font-weight:400;display:flex;gap:8px"><input type="radio" name="res" value="' + o[0] + '"' + (i === 1 ? ' checked' : '') + '> ' + o[1] + '</label>'; }).join('') + '</div><div class="field"><label for="txt">承認条件</label><textarea id="txt" rows="3"></textarea></div><p class="hint">登録者：委員長（あなた）。代理で登録した場合は自動で「代理」と記録されます。</p>'; }
  if (d === 'D8') { title = '回答書（案）を登録する'; body = '<div class="field"><span class="l">回答書のファイル</span><button class="secondary" style="width:max-content">ファイルを選択</button><span class="hint">審議回答書_' + c.no + '.docx（版' + (c.answerVer + 1) + '）。委員会メンバーに内容確認を依頼します。期限：回答書確認 2営業日。</span></div>'; }
  if (d === 'D9') { title = '回答書の修正を依頼する'; body = '<div class="field"><label for="txt">修正してほしい点</label><textarea id="txt" rows="4"></textarea></div>'; ok = '依頼する'; }
  if (d === 'D10') { title = '回答書の内容を確認済みにする'; body = '<p class="hint">回答書（案）版' + c.answerVer + 'の内容（論点の網羅性など）を確認済みにします。事務局が確定できるようになります。</p>'; ok = '確認済みにする'; }
  if (d === 'D11') { title = '回答書を確定する'; body = '<p class="hint">回答書を確定版として固定し、起案者と通知先に通知します。起案者と委員会は 3営業日のあいだ議論を要請できます。</p>'; ok = '確定する'; }
  if (d === 'D12') { title = '議論を要請する'; body = '<div class="field"><label for="txt">理由</label><textarea id="txt" rows="3"></textarea></div><p class="hint">受付期限：' + fmt(c.consultDeadline) + '。要請すると状態が「協議中」になり、事務局が会議を招集します。</p>'; ok = '要請する'; }
  if (d === 'D13') { title = '招集情報を登録する'; body = '<div class="field"><label for="dt">日時</label><input type="datetime-local" id="dt" value="2026-09-30T15:00"></div><div class="field"><label for="lk">Teams 会議のリンク</label><input type="text" id="lk" value="https://teams.microsoft.com/…"></div>'; }
  if (d === 'D14') { title = '結果を確定登録する'; var R = { APPROVE: '承認', APPROVE_WITH_CONDITIONS: '条件付き承認', REJECT: '非承認' }; body = '<div class="kv"><div class="k">審議結果</div><div><strong>' + R[c.result] + '</strong></div><div class="k">承認条件</div><div>' + (esc(c.conditions) || '−') + '</div></div>' + (c.status === 'IN_CONSULTATION' ? '<div class="field"><span class="l">議事録（必須）</span><button class="secondary" style="width:max-content">ファイルを選択</button><span class="hint">議事録_' + c.no + '.docx</span></div>' : '') + '<p class="hint">確定すると起案者・委員会・通知先に通知します。' + (c.result !== 'REJECT' ? '承認のため PPM へ引き渡します。' : '') + '</p>'; ok = '確定登録する'; }
  return '<div class="modal"><div class="dialog" role="dialog" aria-modal="true" aria-label="' + esc(title) + '"><div style="font-size:17px;font-weight:700">' + title + '</div><div class="hint">' + c.no + '　' + esc(c.title) + '</div>' + body + '<div style="display:flex;justify-content:flex-end;gap:10px;margin-top:4px"><button class="secondary" data-act="close">キャンセル</button><button class="primary" data-act="submit" data-d="' + d + '">' + ok + '</button></div></div></div>';
}
function val(sel) { var el = document.querySelector(sel); return el ? el.value : ''; }
function submit(d) {
  var c = cur(), msg = '登録しました';
  if (d === 'D1') { var a = Array.prototype.map.call(document.querySelectorAll('input[name=asg]:checked'), function (x) { return x.value; }); if (!a.length) { toast('担当者を1名以上選んでください'); return; } c.assignees = a; ev(c, '担当者の割当（S03）'); msg = '担当者を割り当てました'; }
  if (d === 'D2') {
    var first = c.briefVer === 0; c.briefVer++; c.applicant = 'UNCHECKED';
    if (first) { c.checks = checks(); c.status = 'BRIEFING'; ev(c, '論点整理書の登録・回付 版' + c.briefVer + '（S04）'); }
    else { Array.prototype.forEach.call(document.querySelectorAll('input[name=reset]:checked'), function (x) { var k = c.checks[+x.value]; k.sel = 'PENDING'; k.by = ''; }); ev(c, '修正版の登録・回付 版' + c.briefVer + '（S07）'); }
    c.due = addBiz(TODAY, 3); c.dueType = '確認'; msg = '版' + c.briefVer + 'を登録し、起案者と審査担当者に回付しました';
  }
  if (d === 'D3') { Array.prototype.forEach.call(document.querySelectorAll('textarea[name=res]'), function (t) { var x = c.comments[+t.dataset.i]; x.resolved = true; x.res = t.value || '対応済み'; }); ev(c, '意見・依頼の対応を記録'); msg = '対応済みにしました'; }
  if (d === 'D4') {
    Array.prototype.forEach.call(document.querySelectorAll('select[name=sel]'), function (s) { var x = c.checks[+s.dataset.i]; if (x.sel !== s.value) { x.sel = s.value; x.by = ME.REV + '（今）'; } });
    Array.prototype.forEach.call(document.querySelectorAll('textarea[name=note]'), function (t) { c.checks[+t.dataset.i].note = t.value; });
    ev(c, '確認表の選択（S06）'); msg = '確認表を保存しました（保留 ' + pending(c) + '件）';
    if (evaluateStep2(c)) msg += '。条件がそろったため審議待ちに進みました';
  }
  if (d === 'D5') { c.comments.push({ kind: '審査担当者の追加依頼', body: val('#txt') || '（依頼内容）', by: ME.REV, ver: c.briefVer, resolved: false, res: '' }); ev(c, '論点の追加依頼（S06）'); msg = '事務局に依頼しました'; }
  if (d === 'D6') { c.status = 'UNDER_REVIEW'; c.due = addBiz(TODAY, 3); c.dueType = '審議'; ev(c, '回答依頼の登録（S10）'); msg = '委員会に回答を依頼しました'; }
  if (d === 'D7') { var r = document.querySelector('input[name=res]:checked'); c.result = r.value; c.conditions = val('#txt'); c.resultBy = '委員長'; c.due = null; c.dueType = ''; ev(c, '審議結果の登録（S11）'); msg = '審議結果を登録しました'; }
  if (d === 'D8') { c.answerVer++; c.answerStatus = 'IN_REVIEW'; c.due = addBiz(TODAY, 2); c.dueType = '回答書確認'; ev(c, '回答書（案）の登録 版' + c.answerVer + '（S12）'); msg = '回答書（案）を登録し、内容確認を依頼しました'; }
  if (d === 'D9') { c.answerStatus = 'REVISION_REQUESTED'; c.comments.push({ kind: '委員の修正依頼', body: val('#txt') || '（修正してほしい点）', by: ME[S.role], ver: c.answerVer, resolved: false, res: '' }); ev(c, '回答書の修正依頼（S13）'); msg = '事務局に修正を依頼しました'; }
  if (d === 'D10') { c.answerStatus = 'CHECKED'; c.due = null; c.dueType = ''; ev(c, '回答書の内容確認完了（S14）'); msg = '確認済みにしました'; }
  if (d === 'D11') { c.answerStatus = 'FINAL'; c.status = 'ANSWERED'; c.consultDeadline = addBiz(TODAY, 3); c.due = c.consultDeadline; c.dueType = '議論要請の受付'; ev(c, '回答書の確定（S15）'); msg = '回答書を確定し、起案者に通知しました'; }
  if (d === 'D12') { c.status = 'IN_CONSULTATION'; c.comments.push({ kind: '議論要請', body: val('#txt') || '（理由）', by: ME[S.role], ver: c.answerVer, resolved: false, res: '' }); c.due = null; c.dueType = ''; ev(c, '議論要請（S17）'); msg = '議論を要請しました'; }
  if (d === 'D13') { c.meeting = { at: val('#dt').replace('T', ' ') }; ev(c, '招集情報の登録（S19a）'); msg = '招集情報を登録し、関係者に通知しました'; }
  if (d === 'D14') { if (c.status === 'IN_CONSULTATION') c.minutes = true; c.status = c.result === 'REJECT' ? 'REJECTED' : 'APPROVED'; c.due = null; c.dueType = ''; if (c.status === 'APPROVED') c.handedOff = fmt(TODAY); ev(c, '結果の確定登録' + (c.status === 'APPROVED' ? '・PPM へ引き渡し（S18／S19b・S21）' : '（S18／S19b）')); msg = '結果を確定しました'; }
  S.dialog = null; toast(msg);
}
var tt; function toast(m) { S.toast = m; render(); clearTimeout(tt); tt = setTimeout(function () { S.toast = ''; render(); }, 2600); }

/* ---------- side panel ---------- */
var NOTES = {
  home: ['ロールごとに「自分の番」の案件だけを出す。複数のロールを持つ人は区画が縦に並ぶ。', '期限を超過した案件は赤い印で先頭に出る。', '行を押すと案件詳細（W3）を開く。Teams・メールの通知のリンクからも同じ画面を開く。', '右の「ロールを切り替える」で、事務局・審査担当者・委員長・委員・PPM の見え方を比べられる。'],
  list: ['全案件を状態・期限超過・自分の担当で絞り込む。', '検索は案件ID・案件名の前方一致（SharePoint 側で絞り込める条件だけを使う）。'],
  detail: ['上部に状態の進み具合・期限・担当。操作ボタンは「今の状態」と「あなたのロール」の両方が合うときだけ出る。', 'ボタンを押すとダイアログが開き、登録はすべてフロー（サービスアカウント）経由で行う。', '「案件概要書」タブでは、項目ごとの AI生成／修正／入力 を表示できる。', '「論点整理」タブの確認表は、保留ゼロ＋起案者の確認完了で自動的に審議待ちへ進む。', '「履歴」タブは事務局だけに出る。']
};
function side() {
  var c = cur();
  var h = '<div><div style="font-size:12px;font-weight:700;color:#0E5A66;letter-spacing:.08em">紙芝居｜審議ワークベンチ</div><div style="margin-top:6px;font-size:12px;color:#555B61;line-height:1.7">画面項目と動作のイメージです。実際の画面は Power Apps の標準部品で作ります。案件はすべて架空のサンプルで、操作はこのページの中だけで反映されます（再読込で元に戻ります）。</div></div>';
  h += '<div style="display:flex;flex-direction:column;gap:6px"><div class="h">ロールを切り替える</div>' + ROLES.map(function (r) { return '<button class="role' + (S.role === r[0] ? ' on' : '') + '" data-act="role" data-r="' + r[0] + '">' + r[1] + '</button>'; }).join('') + '</div>';
  var key = S.view === 'detail' ? 'detail' : S.view;
  h += '<div style="display:flex;flex-direction:column;gap:10px"><div class="h">この画面の動作</div>' + NOTES[key].map(function (t, i) { return '<div class="note"><div class="n">' + (i + 1) + '</div><div>' + t + '</div></div>'; }).join('') + '</div>';
  if (S.view === 'detail' && c) {
    var sims = [];
    if (c.status === 'BRIEFING' && c.applicant !== 'CONFIRMED') sims.push(['simConfirm', '起案者が「確認完了」を登録する']);
    if (c.status === 'BRIEFING') sims.push(['simQuestion', '起案者が疑義・意見を登録する']);
    if (c.status === 'ANSWERED' && c.consultDeadline >= TODAY) sims.push(['simConsult', '起案者が議論を要請する']);
    if (c.status === 'ANSWERED' && c.consultDeadline >= TODAY) sims.push(['simExpire', '受付期限が過ぎたことにする']);
    if (['APPROVED','REJECTED','WITHDRAWN'].indexOf(c.status) < 0) sims.push(['simWithdraw', '起案者が取り下げる']);
    if (sims.length) h += '<div class="sim"><div class="h" style="color:#7A5200">申請用アプリ側の操作を再現（紙芝居用）</div>' + sims.map(function (s) { return '<button data-act="' + s[0] + '">' + s[1] + '</button>'; }).join('') + '</div>';
  }
  return h;
}
var SIM = {
  simConfirm: function (c) { c.applicant = 'CONFIRMED'; ev(c, '確認完了の登録（S08）', '[起案担当者]'); return evaluateStep2(c) ? '起案者が確認完了。条件がそろい、審議待ちに進みました' : '起案者が確認完了しました（確認表の保留が残っています）'; },
  simQuestion: function (c) { c.applicant = 'QUESTIONED'; c.comments.push({ kind: '起案者の疑義・意見', body: '（紙芝居用の疑義・意見）', by: '[起案担当者]', ver: c.briefVer, resolved: false, res: '' }); ev(c, '疑義・意見の登録（S05）', '[起案担当者]'); return '起案者の疑義・意見を登録しました'; },
  simConsult: function (c) { c.status = 'IN_CONSULTATION'; c.comments.push({ kind: '議論要請', body: '（紙芝居用の議論要請）', by: '[起案担当者]', ver: c.answerVer, resolved: false, res: '' }); c.due = null; c.dueType = ''; ev(c, '議論要請（S17）', '[起案担当者]'); return '起案者が議論を要請しました'; },
  simExpire: function (c) { c.consultDeadline = new Date(2026, 8, 22); c.due = c.consultDeadline; ev(c, '議論要請の受付終了（S16・自動）', 'CMS'); return '受付期限が過ぎました。事務局が結果を確定登録できます'; },
  simWithdraw: function (c) { c.status = 'WITHDRAWN'; c.due = null; ev(c, '取り下げ（S20）', '[起案担当者]'); return '起案者が取り下げました（データは残ります）'; }
};

/* ---------- render ---------- */
function render() {
  var body = document.querySelector('.body'), top = body ? body.scrollTop : 0, keep = S._keep; S._keep = false;
  var h = '<div class="wrap"><main class="app"><div class="hdr"><div style="display:flex;align-items:center;gap:12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16M6 20V9l6-5 6 5v11M10 20v-6h4v6"/></svg><span class="name">審議ワークベンチ</span><span style="font-size:12px;color:#A9BFD0">投資委員会 案件管理システム（CMS）</span></div><div style="font-size:13px;color:#D6E0EA">' + esc(ME[S.role]) + '</div></div>';
  h += '<div class="tabs"><button class="' + (S.view === 'home' ? 'on' : '') + '" data-act="view" data-v="home">ホーム</button><button class="' + (S.view === 'list' ? 'on' : '') + '" data-act="view" data-v="list">案件一覧</button></div>';
  h += '<div class="body">' + (S.view === 'home' ? vHome() : S.view === 'list' ? vList() : vDetail()) + '</div>';
  if (S.dialog) h += dlg(S.dialog);
  if (S.toast) h += '<div class="toast" role="status">' + esc(S.toast) + '</div>';
  h += '</main><aside class="side">' + side() + '</aside></div>';
  var active = document.activeElement && document.activeElement.id;
  document.getElementById('root').innerHTML = h;
  var nb = document.querySelector('.body'); if (nb && keep) nb.scrollTop = top;
  if (active === 'q') { var q = document.getElementById('q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
}
function rer() { S._keep = true; render(); }
var root = document.getElementById('root');
root.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]'); if (!b) return; var d = b.dataset, act = d.act;
  if (act === 'open') { S.caseNo = d.no; S.view = 'detail'; S.tab = 'summary'; render(); }
  else if (act === 'view') { S.view = d.v; S.caseNo = null; render(); }
  else if (act === 'back') { S.view = S._from || 'home'; render(); }
  else if (act === 'role') { S.role = d.r; if (S.view === 'detail' && S.tab === 'history' && S.role !== 'SEC') S.tab = 'summary'; rer(); }
  else if (act === 'tab') { S.tab = d.t; rer(); }
  else if (act === 'dlg') { S.dialog = d.d; rer(); }
  else if (act === 'close') { S.dialog = null; rer(); }
  else if (act === 'submit') { submit(d.d); }
  else if (act === 'fStatus') { var f = S.filters.status, i = f.indexOf(d.v); if (i >= 0) f.splice(i, 1); else f.push(d.v); rer(); }
  else if (act === 'fOver') { S.filters.overdue = !S.filters.overdue; rer(); }
  else if (act === 'fMine') { S.filters.mine = !S.filters.mine; rer(); }
  else if (act === 'fClear') { S.filters = { status: [], overdue: false, mine: false, q: '' }; rer(); }
  else if (act === 'pdf') { toast('PDF を作成しています（方式は #T14 で確定）'); }
  else if (SIM[act]) { toast(SIM[act](cur())); }
});
root.addEventListener('mousedown', function (e) { var b = e.target.closest('[data-act=open]'); if (b) S._from = S.view; });
root.addEventListener('input', function (e) { if (e.target.id === 'q') { S.filters.q = e.target.value; rer(); } });
root.addEventListener('change', function (e) { if (e.target.id === 'origin') { S.showOrigin = e.target.checked; rer(); } });
render();
})();
</script>
