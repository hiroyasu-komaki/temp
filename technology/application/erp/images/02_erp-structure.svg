<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="sans-serif" role="img">
<title>ERPの構成要素と拡張の置き場所</title>
<desc>ERP本体は業務モジュール・マスタデータ・組織構造・共通基盤で構成され、標準機能と設定で動く。拡張は本体の中のアドオンか、公開APIでつないだ本体の外の基盤に置く。</desc>
<style>
.box{fill:#fff;stroke:#12305e;stroke-width:1.5}
.sub{fill:#fff;stroke:#8a94a3;stroke-width:1}
.dash{fill:#fff;stroke:#8a94a3;stroke-width:1.2;stroke-dasharray:5 4}
.layer{fill:#f4f6f9;stroke:none}
.zone{fill:none;stroke:#8a94a3;stroke-width:1}
.zonef{fill:#fafbfc;stroke:#c4cad3;stroke-width:1}
.cross{fill:#e9edf3;stroke:none}
.T{fill:#1b2430;font-size:15px;font-weight:bold;text-anchor:middle}
.t{fill:#1b2430;font-size:11.5px;text-anchor:middle}
.tb{fill:#1b2430;font-size:11.5px;font-weight:bold;text-anchor:middle}
.t2{fill:#1b2430;font-size:10.5px;text-anchor:middle}
.s{fill:#5b6573;font-size:9.5px;text-anchor:middle}
.L{fill:#1b2430;font-size:11.5px;font-weight:bold}
.Ls{fill:#5b6573;font-size:10px}
.Lr{fill:#5b6573;font-size:10px;text-anchor:end}
.a{fill:#5b6573;font-size:9.5px;text-anchor:middle}
.ln{stroke:#5b6573;stroke-width:1.3;fill:none}
.lnd{stroke:#5b6573;stroke-width:1.2;fill:none;stroke-dasharray:4 3}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6573"/></marker></defs>
<rect x="0" y="0" width="960" height="420" fill="#fff"/>
<rect x="20" y="20" width="620" height="380" class="zonef"/>
<text x="32" y="40" class="L">ERP 本体</text>
<text x="628" y="40" class="Lr">① 標準機能 ＋ ② 設定（コンフィグ）</text>
<rect x="30" y="52" width="600" height="120" class="layer"/>
<text x="42" y="72" class="L">業務モジュール</text>
<rect x="42" y="84" width="76" height="48" class="box"/>
<text x="80.0" y="104.5" class="tb">財務会計</text>
<text x="80.0" y="119.5" class="s">FI</text>
<rect x="125" y="84" width="76" height="48" class="box"/>
<text x="163.0" y="104.5" class="tb">管理会計</text>
<text x="163.0" y="119.5" class="s">CO</text>
<rect x="208" y="84" width="76" height="48" class="box"/>
<text x="246.0" y="104.5" class="tb">販売</text>
<text x="246.0" y="119.5" class="s">SD</text>
<rect x="291" y="84" width="76" height="48" class="box"/>
<text x="329.0" y="104.5" class="tb">購買・在庫</text>
<text x="329.0" y="119.5" class="s">MM</text>
<rect x="374" y="84" width="76" height="48" class="box"/>
<text x="412.0" y="104.5" class="tb">生産計画</text>
<text x="412.0" y="119.5" class="s">PP</text>
<rect x="457" y="84" width="76" height="48" class="box"/>
<text x="495.0" y="104.5" class="tb">品質</text>
<text x="495.0" y="119.5" class="s">QM</text>
<rect x="540" y="84" width="76" height="48" class="box"/>
<text x="578.0" y="104.5" class="tb">保全</text>
<text x="578.0" y="119.5" class="s">PM</text>
<text x="330" y="156" class="a">購買の流れ：発注 → 入庫 → 在庫計上 → 請求書照合 → 支払（各段階で会計の仕訳が自動で作られる）</text>
<rect x="30" y="180" width="600" height="50" class="layer"/>
<text x="42" y="210" class="L">マスタデータ</text>
<text x="370" y="210" class="t">品目・取引先・BOM・レシピ・勘定科目（全モジュールで共有）</text>
<rect x="30" y="238" width="600" height="50" class="layer"/>
<text x="42" y="268" class="L">組織構造</text>
<text x="370" y="268" class="t">会社コード・プラント・保管場所（業務の単位）</text>
<rect x="30" y="296" width="600" height="50" class="layer"/>
<text x="42" y="326" class="L">共通基盤</text>
<text x="370" y="326" class="t">権限・ワークフロー・帳票・インターフェース</text>
<rect x="42" y="354" width="576" height="34" class="dash"/>
<text x="330" y="375" class="t">③ 拡張（本体の中のアドオン：WRICEF）— アップグレードのたびに影響調査と改修が要る</text>
<rect x="700" y="20" width="240" height="380" class="zonef"/>
<text x="712" y="40" class="L">本体の外（サイドバイサイド）</text>
<rect x="720" y="84" width="200" height="64" class="box"/>
<text x="820.0" y="112.5" class="tb">③ 拡張の基盤</text>
<text x="820.0" y="127.5" class="s">SAP BTP ／ Power Platform など</text>
<polyline points="640,116 720,116" class="ln" marker-end="url(#ar)" marker-start="url(#ar)"/>
<text x="680" y="108" class="a">公開 API</text>
<text x="680" y="132" class="a">イベント</text>
<text x="820" y="190" class="a">標準部分に手を入れず、</text>
<text x="820" y="208" class="a">拡張は公開 API を介して外側に置く</text>
<text x="820" y="226" class="a">（Clean Core）</text>
<text x="820" y="244" class="a"></text>
<text x="820" y="262" class="a">アップグレードの影響を受けにくい</text>
</svg>