<polyline points="600.0,278 240.0,278" class="ax" marker-end="url(#ar)"/>
<text x="420.0" y="272" class="a">市場の動き：新しい機能はクラウドの契約に寄る</text>
<text x="420.0" y="292" class="s">（SAP は AI などの新機能を RISE・GROW に限る方針。ECC の標準保守は2027年末に終了）</text>
<text x="15" y="310" class="Ls">縦軸と横軸の取り方はトピックごとに変わる。分類の根拠は各トピックの 03章（本資料の整理）</text>
