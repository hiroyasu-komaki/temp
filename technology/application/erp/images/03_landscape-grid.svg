<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 318" font-family="sans-serif" width="800" height="363" role="img">
<title>03章の製品の分類の例（ERP）</title>
<desc>提供元の種類と提供形態の2軸で、ERP の製品を格子に配置した例</desc>
<style>
.box{fill:#fff;stroke:#12305e;stroke-width:1.5}
.sub{fill:#fff;stroke:#8a94a3;stroke-width:1}
