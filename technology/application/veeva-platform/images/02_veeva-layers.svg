<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="sans-serif" role="img">
<title>Veeva の3層構造</title>
<desc>Veevaの製品は、業界データ・業務アプリケーション・共通基盤（Vault Platform）の3層からなる。アプリは同じ基盤の上にあり、アプリ間の連携は基盤内のリンクとして実現される。外部のシステムとはVault API・Direct Data API・Loaderでつながる。</desc>
<style>
.box{fill:#fff;stroke:#12305e;stroke-width:1.5}
.sub{fill:#fff;stroke:#8a94a3;stroke-width:1}
.dash{fill:#fff;stroke:#8a94a3;stroke-width:1.2;stroke-dasharray:5 4}
.layer{fill:#f4f6f9;stroke:none}
.zone{fill:none;stroke:#8a94a3;stroke-width:1}
.zonef{fill:#fafbfc;stroke:#c4cad3;stroke-width:1}
.cross{fill:#e9edf3;stroke:none}
.T{fill:#1b2430;font-size:15px;font-weight:bold;text-anchor:middle}
.t{fill:#1b2430;font-size:11.5px;text-anchor:middle}
.tb{fill:#1b2430;font-size:11.5px;font-weight:bold;text-anchor:middle}
.t2{fill:#1b2430;font-size:10.5px;text-anchor:middle}
.s{fill:#5b6573;font-size:9.5px;text-anchor:middle}
.L{fill:#1b2430;font-size:11.5px;font-weight:bold}
.Ls{fill:#5b6573;font-size:10px}
.Lr{fill:#5b6573;font-size:10px;text-anchor:end}
.a{fill:#5b6573;font-size:9.5px;text-anchor:middle}
.ln{stroke:#5b6573;stroke-width:1.3;fill:none}
.lnd{stroke:#5b6573;stroke-width:1.2;fill:none;stroke-dasharray:4 3}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6573"/></marker></defs>
<rect x="0" y="0" width="960" height="400" fill="#fff"/>
<rect x="20" y="20" width="740" height="74" class="layer"/>
<text x="32" y="55.0" class="L">業界データ</text>
<text x="32" y="71.0" class="Ls">Veeva が整備・販売</text>
<rect x="130" y="34" width="190" height="46" class="box"/>
<text x="225.0" y="53.5" class="tb">Veeva Link</text>
<text x="225.0" y="68.5" class="s">KOL・科学情報</text>
<rect x="335" y="34" width="190" height="46" class="box"/>
<text x="430.0" y="53.5" class="tb">Veeva Compass</text>
<text x="430.0" y="68.5" class="s">処方・患者のデータ</text>
<rect x="540" y="34" width="190" height="46" class="box"/>
<text x="635.0" y="53.5" class="tb">Veeva OpenData</text>
<text x="635.0" y="68.5" class="s">医師・施設のマスタ</text>
<rect x="20" y="104" width="740" height="148" class="layer"/>
<text x="32" y="176.0" class="L">アプリケーション</text>
<text x="32" y="192.0" class="Ls">業務領域ごと</text>
<rect x="130" y="114" width="386" height="128" class="zone"/>
<text x="140" y="132" class="Ls">R&amp;D（臨床・薬事・安全性・品質）</text>
<rect x="138" y="146" width="69" height="48" class="box"/>
<text x="172.5" y="166.5" class="t2">CTMS</text>
<text x="172.5" y="181.5" class="s">治験の管理</text>
<rect x="213" y="146" width="69" height="48" class="box"/>
<text x="247.5" y="166.5" class="t2">RIM</text>
<text x="247.5" y="181.5" class="s">承認申請</text>
<rect x="288" y="146" width="69" height="48" class="box"/>
<text x="322.5" y="166.5" class="t2">Safety</text>
<text x="322.5" y="181.5" class="s">安全性</text>
<rect x="363" y="146" width="69" height="48" class="box"/>
<text x="397.5" y="166.5" class="t2">QMS</text>
<text x="397.5" y="181.5" class="s">品質</text>
<rect x="438" y="146" width="69" height="48" class="box"/>
<text x="472.5" y="166.5" class="t2">QualityDocs</text>
<text x="472.5" y="181.5" class="s">品質文書</text>
<rect x="526" y="114" width="224" height="128" class="zone"/>
<text x="742" y="132" class="Lr">コマーシャル</text>
<rect x="531" y="146" width="69" height="48" class="box"/>
<text x="565.5" y="166.5" class="t2">Vault CRM</text>
<text x="565.5" y="181.5" class="s">営業</text>
<rect x="604" y="146" width="69" height="48" class="box"/>
<text x="638.5" y="166.5" class="t2">PromoMats</text>
<text x="638.5" y="181.5" class="s">販促資材</text>
<rect x="677" y="146" width="69" height="48" class="box"/>
<text x="711.5" y="166.5" class="t2">MedComms</text>
<text x="711.5" y="181.5" class="s">メディカル</text>
<polyline points="638.5,194 638.5,206 565.5,206 565.5,194" class="ln" marker-end="url(#ar)"/>
<text x="638" y="222" class="a">承認済みの資材を CRM に配信</text>
<text x="638" y="236" class="a">（Veeva Connections）</text>
<polyline points="565.5,80 565.5,146" class="ln" marker-end="url(#ar)"/>
<text x="323" y="226" class="a">例：QualityDocs の文書を申請で参照（同じ基盤内のリンク）</text>
<rect x="20" y="262" width="740" height="118" class="layer"/>
<text x="32" y="319.0" class="L">基盤</text>
<text x="32" y="335.0" class="Ls">Vault Platform</text>
<rect x="130" y="290" width="118" height="62" class="box"/>
<text x="189.0" y="317.5" class="tb">コンテンツ管理</text>
<text x="189.0" y="332.5" class="s">版・状態・電子署名</text>
<rect x="256" y="290" width="118" height="62" class="box"/>
<text x="315.0" y="317.5" class="tb">データ管理</text>
<text x="315.0" y="332.5" class="s">Object Framework</text>
<rect x="382" y="290" width="118" height="62" class="box"/>
<text x="441.0" y="317.5" class="tb">ワークフロー</text>
<text x="441.0" y="332.5" class="s">ライフサイクル・権限</text>
<rect x="508" y="290" width="118" height="62" class="box"/>
<text x="567.0" y="317.5" class="tb">監査証跡</text>
<text x="567.0" y="332.5" class="s">Part 11 対応の操作履歴</text>
<rect x="634" y="290" width="118" height="62" class="box"/>
<text x="693.0" y="317.5" class="tb">Vault AI</text>
<text x="693.0" y="332.5" class="s">アプリに組み込みの AI</text>
<rect x="820" y="104" width="130" height="276" class="zonef"/>
<text x="830" y="124" class="L">外部のシステム</text>
<rect x="828" y="140" width="114" height="52" class="box"/>
<text x="885.0" y="162.5" class="tb">ERP・製造系</text>
<text x="885.0" y="177.5" class="s">Vault API・Loader</text>
<polyline points="790,166 828,166" class="ln" marker-end="url(#ar)"/>
<rect x="828" y="216" width="114" height="52" class="box"/>
<text x="885.0" y="238.5" class="tb">分析基盤</text>
<text x="885.0" y="253.5" class="s">Direct Data API</text>
<polyline points="790,242 828,242" class="ln" marker-end="url(#ar)"/>
<rect x="828" y="292" width="114" height="52" class="box"/>
<text x="885.0" y="314.5" class="tb">データ移行</text>
<text x="885.0" y="329.5" class="s">Loader</text>
<polyline points="790,318 828,318" class="ln" marker-end="url(#ar)"/>
<polyline points="760,321 790,321 790,166" class="ln"/>
</svg>