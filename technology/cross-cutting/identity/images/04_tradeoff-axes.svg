<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="sans-serif" width="800" height="376" role="img">
<title>ID・アクセス管理の論点と製品の寄り方</title>
<desc>ID・アクセス管理の論点と製品の寄り方</desc>
<style>
.box{fill:#fff;stroke:#12305e;stroke-width:1.5}
.sub{fill:#fff;stroke:#8a94a3;stroke-width:1}
.dash{fill:#fff;stroke:#8a94a3;stroke-width:1.2;stroke-dasharray:5 4}
.layer{fill:#f4f6f9;stroke:none}
.zone{fill:none;stroke:#8a94a3;stroke-width:1}
.zonef{fill:#fafbfc;stroke:#c4cad3;stroke-width:1}
.cross{fill:#e9edf3;stroke:none}
.T{fill:#1b2430;font-size:15px;font-weight:bold;text-anchor:middle}
.t{fill:#1b2430;font-size:11.5px;text-anchor:middle}
.tb{fill:#1b2430;font-size:11.5px;font-weight:bold;text-anchor:middle}
.t2{fill:#1b2430;font-size:10.5px;text-anchor:middle}
.s{fill:#5b6573;font-size:9.5px;text-anchor:middle}
.L{fill:#1b2430;font-size:11.5px;font-weight:bold}
.Ls{fill:#5b6573;font-size:10px}
.Lr{fill:#5b6573;font-size:10px;text-anchor:end}
.a{fill:#5b6573;font-size:9.5px;text-anchor:middle}
.ln{stroke:#5b6573;stroke-width:1.3;fill:none}
.lnd{stroke:#5b6573;stroke-width:1.2;fill:none;stroke-dasharray:4 3}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6573"/></marker></defs>
<rect x="0" y="0" width="1000" height="470" fill="#fff"/>
<style>.ax{stroke:#12305e;stroke-width:1.8;fill:none}.axd{stroke:#8a94a3;stroke-width:1.6;fill:none;stroke-dasharray:6 5}.ab{fill:#1b2430;font-size:14px;font-weight:bold}.pr{fill:#3a4656;font-size:12px}.ttl{fill:#1b2430;font-size:16px;font-weight:bold}.no{fill:#12305e;font-size:13px;font-weight:bold}.nd{fill:#8a94a3;font-size:11px;text-anchor:middle}.ex{fill:#8a94a3;font-size:12px;text-anchor:middle}</style>
<text x="20" y="30" class="ttl">ID・アクセス管理の論点と製品の寄り方</text>
<text x="20" y="79" class="no">論点1</text>
<polyline points="250,74 750,74" class="ax" marker-end="url(#ar)" marker-start="url(#ar)"/>
<text x="240" y="79" class="ab" text-anchor="end">1つにまとめる</text>
<text x="760" y="79" class="ab">複数を併用する</text>
<text x="256" y="96" class="pr">IDaaSのどれか1つに寄せる形</text>
<text x="744" y="96" class="pr" text-anchor="end">併用</text>
<text x="20" y="157" class="no">論点2</text>
<polyline points="250,152 750,152" class="ax" marker-end="url(#ar)" marker-start="url(#ar)"/>
<text x="240" y="157" class="ab" text-anchor="end">IdP の付属機能</text>
<text x="760" y="157" class="ab">専門の IGA 製品</text>
<text x="256" y="174" class="pr">Microsoft Entra ID…</text>
<text x="744" y="174" class="pr" text-anchor="end">SailPoint Identity…</text>
<text x="744" y="189" class="pr" text-anchor="end">Saviynt Identity C… ほか</text>
<text x="20" y="235" class="no">論点3</text>
<polyline points="250,230 750,230" class="axd"/>
<text x="240" y="235" class="ab" text-anchor="end">人事システムを起点にする</text>
<text x="760" y="235" class="ab">IT 部門が申請を受けて作る</text>
<text x="500.0" y="223" class="nd">製品では決まらない（運用の選択）</text>
<text x="20" y="313" class="no">論点4</text>
<polyline points="250,308 750,308" class="ax" marker-end="url(#ar)" marker-start="url(#ar)"/>
<text x="240" y="313" class="ab" text-anchor="end">常時与える</text>
<text x="760" y="313" class="ab">使うときだけ与える</text>
<text x="256" y="330" class="pr">03章には該当なし</text>
<text x="744" y="330" class="pr" text-anchor="end">Microsoft Entra PIM</text>
<text x="744" y="345" class="pr" text-anchor="end">CyberArk ほか</text>
<text x="20" y="391" class="no">論点5</text>
<polyline points="250,386 750,386" class="axd"/>
<text x="240" y="391" class="ab" text-anchor="end">一律</text>
<text x="760" y="391" class="ab">重要度に応じて変える</text>
<text x="500.0" y="379" class="nd">製品では決まらない（設定の選択）</text>
<text x="20" y="460" class="Ls">実線：03章の製品・提供形態が両端に分かれる軸　破線：製品では決まらない軸（本資料の整理）</text>
</svg>