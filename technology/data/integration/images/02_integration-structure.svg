<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="sans-serif" role="img">
<title>連携基盤の構成要素と、社内・クラウドをまたぐ構成</title>
<desc>クラウドの連携基盤（ハブ）はコネクタ・マッピング・フロー・トリガー・実行環境・運用管理で構成され、社内のシステムには社内に置いたエージェント経由でつながる。連携基盤には一時ファイルやログなどにデータが残る。</desc>
<style>
.box{fill:#fff;stroke:#12305e;stroke-width:1.5}
.sub{fill:#fff;stroke:#8a94a3;stroke-width:1}
.dash{fill:#fff;stroke:#8a94a3;stroke-width:1.2;stroke-dasharray:5 4}
.layer{fill:#f4f6f9;stroke:none}
.zone{fill:none;stroke:#8a94a3;stroke-width:1}
.zonef{fill:#fafbfc;stroke:#c4cad3;stroke-width:1}
.cross{fill:#e9edf3;stroke:none}
.T{fill:#1b2430;font-size:15px;font-weight:bold;text-anchor:middle}
.t{fill:#1b2430;font-size:11.5px;text-anchor:middle}
.tb{fill:#1b2430;font-size:11.5px;font-weight:bold;text-anchor:middle}
.t2{fill:#1b2430;font-size:10.5px;text-anchor:middle}
.s{fill:#5b6573;font-size:9.5px;text-anchor:middle}
.L{fill:#1b2430;font-size:11.5px;font-weight:bold}
.Ls{fill:#5b6573;font-size:10px}
.Lr{fill:#5b6573;font-size:10px;text-anchor:end}
.a{fill:#5b6573;font-size:9.5px;text-anchor:middle}
.ln{stroke:#5b6573;stroke-width:1.3;fill:none}
.lnd{stroke:#5b6573;stroke-width:1.2;fill:none;stroke-dasharray:4 3}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6573"/></marker></defs>
<rect x="0" y="0" width="960" height="420" fill="#fff"/>
<rect x="20" y="20" width="620" height="254" class="zonef"/>
<text x="32" y="40" class="L">クラウド</text>
<rect x="200" y="48" width="420" height="212" class="box"/>
<text x="410" y="68" class="tb">連携基盤（ハブ）</text>
<rect x="214" y="80" width="92" height="50" class="sub"/>
<text x="260.0" y="101.5" class="tb">コネクタ</text>
<text x="260.0" y="116.5" class="s">各システムに接続</text>
<rect x="314" y="80" width="92" height="50" class="sub"/>
<text x="360.0" y="101.5" class="tb">マッピング</text>
<text x="360.0" y="116.5" class="s">形式・コード変換</text>
<rect x="414" y="80" width="92" height="50" class="sub"/>
<text x="460.0" y="101.5" class="tb">フロー</text>
<text x="460.0" y="116.5" class="s">順序・分岐</text>
<rect x="514" y="80" width="92" height="50" class="sub"/>
<text x="560.0" y="101.5" class="tb">トリガー</text>
<text x="560.0" y="116.5" class="s">起動のきっかけ</text>
<rect x="214" y="140" width="392" height="34" class="sub"/>
<text x="410.0" y="161.0" class="t">実行環境（ランタイム）：クラウド上 ／ 社内のエージェント上</text>
<rect x="214" y="184" width="392" height="62" class="sub"/>
<text x="410.0" y="204.0" class="tb">運用管理</text>
<text x="410.0" y="219.0" class="s">実行ログ・エラー通知・再実行</text>
<text x="410.0" y="234.0" class="s">利用者と権限・環境（開発 → 検証 → 本番）</text>
<rect x="36" y="70" width="130" height="50" class="box"/>
<text x="101.0" y="91.5" class="tb">SaaS</text>
<text x="101.0" y="106.5" class="s">CRM・人事など</text>
<rect x="36" y="160" width="130" height="50" class="box"/>
<text x="101.0" y="181.5" class="tb">クラウドの</text>
<text x="101.0" y="196.5" class="s">DB・API</text>
<polyline points="166,95 200,95" class="ln" marker-end="url(#ar)" marker-start="url(#ar)"/>
<polyline points="166,185 200,185" class="ln" marker-end="url(#ar)" marker-start="url(#ar)"/>
<rect x="660" y="20" width="280" height="380" class="zonef"/>
<text x="672" y="40" class="L">社内ネットワーク</text>
<rect x="690" y="56" width="220" height="52" class="box"/>
<text x="800.0" y="78.5" class="tb">エージェント</text>
<text x="800.0" y="93.5" class="s">社内に置く実行環境</text>
<polyline points="620,82 690,82" class="ln" marker-end="url(#ar)" marker-start="url(#ar)"/>
<text x="655" y="74" class="a">接続</text>
<rect x="676" y="150" width="76" height="44" class="box"/>
<text x="714.0" y="176.0" class="tb">DB</text>
<polyline points="800,108 800,128 714,128 714,150" class="ln" marker-end="url(#ar)"/>
<rect x="764" y="150" width="76" height="44" class="box"/>
<text x="802.0" y="168.5" class="tb">ファイル</text>
<text x="802.0" y="183.5" class="s">サーバ</text>
<polyline points="800,108 800,128 802,128 802,150" class="ln" marker-end="url(#ar)"/>
<rect x="852" y="150" width="76" height="44" class="box"/>
<text x="890.0" y="168.5" class="tb">レガシー</text>
<text x="890.0" y="183.5" class="s">システム</text>
<polyline points="800,108 800,128 890,128 890,150" class="ln" marker-end="url(#ar)"/>
<rect x="690" y="236" width="220" height="52" class="sub"/>
<text x="800.0" y="258.5" class="tb">ジョブ管理</text>
<text x="800.0" y="273.5" class="s">夜間処理との順序の調整</text>
<polyline points="910,82 926,82 926,262 910,262" class="lnd" marker-end="url(#ar)" marker-start="url(#ar)"/>
<rect x="690" y="316" width="220" height="62" class="sub"/>
<text x="800.0" y="343.5" class="tb">インターフェース台帳</text>
<text x="800.0" y="358.5" class="s">どの連携が、どこと、誰の担当か</text>
<rect x="20" y="290" width="620" height="110" class="dash"/>
<text x="32" y="310" class="L">連携基盤に残るデータ（「データを保持しない」場合に設計で押さえる範囲）</text>
<rect x="34" y="324" width="140" height="58" class="sub"/>
<text x="104.0" y="349.5" class="tb">一時ファイル</text>
<text x="104.0" y="364.5" class="s">処理後に消しているか</text>
<rect x="184" y="324" width="140" height="58" class="sub"/>
<text x="254.0" y="349.5" class="tb">実行ログ</text>
<text x="254.0" y="364.5" class="s">中身をマスキングしているか</text>
<rect x="334" y="324" width="140" height="58" class="sub"/>
<text x="404.0" y="349.5" class="tb">再実行用データ</text>
<text x="404.0" y="364.5" class="s">いつまで残し、いつ消すか</text>
<rect x="484" y="324" width="140" height="58" class="sub"/>
<text x="554.0" y="349.5" class="tb">バックアップ</text>
<text x="554.0" y="364.5" class="s">上記を含んでいないか</text>
<polyline points="410,260 410,290" class="lnd" marker-end="url(#ar)"/>
</svg>