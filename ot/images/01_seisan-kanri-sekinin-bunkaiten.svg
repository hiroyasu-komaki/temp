<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img">
<title>生産管理システムの責任分解(レイヤー別)</title>
<desc>生産管理システムという1つのシステムの中で、インフラ基盤、標準機能・ERP連携、工場固有カスタマイズ、業務運用、下流システム接続という5つの層に分けて、IT部門・生産IT・生産部門のどこが担当するかを示す図。</desc>
<rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

<text x="500" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">生産管理システムの責任分解(レイヤー別)</text>

<rect x="330" y="42" width="14" height="14" fill="#2563eb" opacity="0.25" stroke="#2563eb"/>
<text x="350" y="53" font-size="11" fill="#6b7280">IT部門</text>
<rect x="440" y="42" width="14" height="14" fill="#16a34a" opacity="0.25" stroke="#16a34a"/>
<text x="460" y="53" font-size="11" fill="#6b7280">生産IT</text>
<rect x="550" y="42" width="14" height="14" fill="#7c3aed" opacity="0.25" stroke="#7c3aed"/>
<text x="570" y="53" font-size="11" fill="#6b7280">生産部門</text>

<rect x="80" y="80" width="840" height="86" rx="8" fill="#2563eb" opacity="0.12" stroke="#2563eb" stroke-width="1.5"/>
<text x="100" y="106" font-size="13" font-weight="700" fill="#1a1a1a">インフラ・アカウント基盤</text>
<text x="100" y="126" font-size="11" fill="#6b7280">サーバー・ネットワーク・権限管理</text>
<text x="820" y="116" text-anchor="end" font-size="12" font-weight="700" fill="#2563eb">IT部門</text>

<rect x="80" y="174" width="840" height="86" rx="8" fill="#2563eb" opacity="0.12" stroke="#2563eb" stroke-width="1.5"/>
<text x="100" y="200" font-size="13" font-weight="700" fill="#1a1a1a">標準機能・ERP連携・全社マスタ</text>
<text x="100" y="220" font-size="11" fill="#6b7280">パッケージ標準機能の維持、品目マスタ等の一元管理</text>
<text x="820" y="210" text-anchor="end" font-size="12" font-weight="700" fill="#2563eb">IT部門(生産IT協力)</text>

<rect x="80" y="268" width="840" height="86" rx="8" fill="#16a34a" opacity="0.12" stroke="#16a34a" stroke-width="1.5"/>
<text x="100" y="294" font-size="13" font-weight="700" fill="#1a1a1a">工場固有カスタマイズ・現場マスタ</text>
<text x="100" y="314" font-size="11" fill="#6b7280">工程/設備コード、帳票カスタマイズ、MES接続仕様</text>
<text x="820" y="304" text-anchor="end" font-size="12" font-weight="700" fill="#16a34a">生産IT(IT部門協力)</text>

<rect x="80" y="362" width="840" height="86" rx="8" fill="#7c3aed" opacity="0.12" stroke="#7c3aed" stroke-width="1.5"/>
<text x="100" y="388" font-size="13" font-weight="700" fill="#1a1a1a">業務運用</text>
<text x="100" y="408" font-size="11" fill="#6b7280">生産計画立案・実績入力・日次オペレーション</text>
<text x="820" y="398" text-anchor="end" font-size="12" font-weight="700" fill="#7c3aed">生産部門</text>

<rect x="80" y="456" width="840" height="86" rx="8" fill="#16a34a" opacity="0.12" stroke="#16a34a" stroke-width="1.5"/>
<text x="100" y="482" font-size="13" font-weight="700" fill="#1a1a1a">下流システムとの接続</text>
<text x="100" y="502" font-size="11" fill="#6b7280">MES・SCADA・PLCとのデータ連携、設備側仕様への対応</text>
<text x="820" y="492" text-anchor="end" font-size="12" font-weight="700" fill="#16a34a">生産IT</text>

<text x="80" y="575" font-size="12" fill="#6b7280">※ 同じ「生産管理システム」という1つの箱でも、担当は機能レイヤーによって異なる。二重管理に見える状態は、</text>
<text x="80" y="595" font-size="12" fill="#6b7280">この層別の切り分けが明文化されていないことが原因であり、実際には競合しない分担が可能なことが多い。</text>
</svg>
