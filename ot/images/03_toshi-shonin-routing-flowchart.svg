<svg viewBox="0 0 1000 830" xmlns="http://www.w3.org/2000/svg" role="img">
<title>IT投資案件の承認ルーティング判定フロー</title>
<desc>対象レイヤー、影響度、影響度の判定材料不足、セキュリティ・ネットワーク影響、規制・安全要件の問いに順に答えることで、IT部門単独承認、生産本部単独承認、両部門の共同承認(どちらが先か含む)、追加ゲートの要否を判定するフローチャート。判定材料が「不明」の場合は保守側(重いルート)に倒す。</desc>
<rect x="0" y="0" width="1000" height="830" fill="#ffffff"/>

<text x="500" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">IT投資案件の承認ルーティング判定フロー</text>

<rect x="330" y="36" width="12" height="12" fill="#2563eb" opacity="0.25" stroke="#2563eb"/>
<text x="348" y="46" font-size="10" fill="#6b7280">IT部門</text>
<rect x="420" y="36" width="12" height="12" fill="#16a34a" opacity="0.25" stroke="#16a34a"/>
<text x="438" y="46" font-size="10" fill="#6b7280">生産本部</text>
<rect x="520" y="36" width="12" height="12" fill="#d97706" opacity="0.25" stroke="#d97706"/>
<text x="538" y="46" font-size="10" fill="#6b7280">共同</text>
<rect x="600" y="36" width="12" height="12" fill="#7c3aed" opacity="0.25" stroke="#7c3aed"/>
<text x="618" y="46" font-size="10" fill="#6b7280">他部門関与</text>

<rect x="150" y="60" width="500" height="46" rx="8" fill="#f3f4f6" stroke="#1a1a1a" stroke-width="1"/>
<text x="400" y="88" text-anchor="middle" font-size="12" fill="#1a1a1a">投資案件(レイヤー・影響度・リスク・コスト情報を記載)</text>

<line x1="400" y1="106" x2="400" y2="136" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="150" y="136" width="500" height="46" rx="8" fill="#f3f4f6" stroke="#1a1a1a" stroke-width="1"/>
<text x="400" y="164" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Q1. 対象レイヤーは?</text>

<line x1="650" y1="159" x2="700" y2="159" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="655" y="149" font-size="10" fill="#6b7280">複合/不明</text>
<rect x="700" y="136" width="260" height="46" rx="8" fill="#6b7280" opacity="0.12" stroke="#6b7280" stroke-width="1.5"/>
<text x="830" y="164" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">要協議(レイヤー未確定)</text>

<line x1="250" y1="182" x2="250" y2="216" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="150" y="200" font-size="10" fill="#6b7280">ERP/MES標準機能</text>
<line x1="550" y1="182" x2="550" y2="216" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="430" y="200" font-size="10" fill="#6b7280">MES工場固有/SCADA以下</text>

<rect x="150" y="216" width="200" height="52" rx="8" fill="#2563eb" opacity="0.15" stroke="#2563eb" stroke-width="1.5"/>
<text x="250" y="247" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">承認主体候補: IT部門</text>

<rect x="450" y="216" width="200" height="52" rx="8" fill="#16a34a" opacity="0.15" stroke="#16a34a" stroke-width="1.5"/>
<text x="550" y="247" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">承認主体候補: 生産本部</text>

<line x1="250" y1="268" x2="400" y2="316" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="550" y1="268" x2="400" y2="316" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="150" y="316" width="500" height="52" rx="8" fill="#f3f4f6" stroke="#1a1a1a" stroke-width="1"/>
<text x="400" y="340" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Q2. 影響度に該当?</text>
<text x="400" y="358" text-anchor="middle" font-size="10" fill="#6b7280">(全社影響/全社システム接続/マスタ影響)</text>

<line x1="650" y1="342" x2="700" y2="342" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="655" y="332" font-size="10" fill="#6b7280">該当</text>
<rect x="700" y="307" width="260" height="70" rx="8" fill="#d97706" opacity="0.15" stroke="#d97706" stroke-width="1.5"/>
<text x="830" y="329" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">両部門の共同承認</text>
<text x="830" y="347" text-anchor="middle" font-size="10" fill="#6b7280">承認主体候補が一次承認</text>
<text x="830" y="363" text-anchor="middle" font-size="10" fill="#6b7280">→他方が合議→最終決裁</text>

<line x1="400" y1="368" x2="400" y2="404" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="410" y="390" font-size="10" fill="#6b7280">非該当</text>

<rect x="150" y="404" width="500" height="52" rx="8" fill="#f3f4f6" stroke="#1a1a1a" stroke-width="1"/>
<text x="400" y="428" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Q2'. 影響度3項目に「不明」あり?</text>
<text x="400" y="446" text-anchor="middle" font-size="10" fill="#6b7280">(「有」該当はないが、1つ以上が「不明」)</text>

<line x1="650" y1="430" x2="700" y2="430" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="655" y="420" font-size="10" fill="#6b7280">あり</text>
<rect x="700" y="399" width="260" height="62" rx="8" fill="#d97706" opacity="0.15" stroke="#d97706" stroke-width="1.5"/>
<text x="830" y="419" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">共同承認(判定材料不足)</text>
<text x="830" y="437" text-anchor="middle" font-size="10" fill="#6b7280">合議で不明項目を確定させ、</text>
<text x="830" y="453" text-anchor="middle" font-size="10" fill="#6b7280">確定後に再判定して軽くできる</text>

<line x1="400" y1="456" x2="400" y2="492" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="410" y="478" font-size="10" fill="#6b7280">なし</text>

<rect x="150" y="492" width="500" height="46" rx="8" fill="#f3f4f6" stroke="#1a1a1a" stroke-width="1"/>
<text x="400" y="520" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Q3. セキュリティ・ネットワーク影響は?</text>

<line x1="650" y1="515" x2="700" y2="515" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="655" y="505" font-size="10" fill="#6b7280">あり/不明</text>
<rect x="700" y="480" width="260" height="70" rx="8" fill="#2563eb" opacity="0.15" stroke="#2563eb" stroke-width="1.5"/>
<text x="830" y="502" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">承認主体候補の承認</text>
<text x="830" y="520" text-anchor="middle" font-size="10" fill="#6b7280">+IT部門セキュリティ審査</text>
<text x="830" y="536" text-anchor="middle" font-size="10" fill="#6b7280">(着手前提・実質的に先)</text>

<line x1="400" y1="538" x2="400" y2="574" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="410" y="560" font-size="10" fill="#6b7280">なし</text>

<rect x="150" y="574" width="500" height="46" rx="8" fill="#f3f4f6" stroke="#1a1a1a" stroke-width="1"/>
<text x="400" y="602" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Q4. 規制・安全要件は?</text>

<line x1="650" y1="597" x2="700" y2="597" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="655" y="587" font-size="10" fill="#6b7280">あり/不明</text>
<rect x="700" y="567" width="260" height="60" rx="8" fill="#7c3aed" opacity="0.15" stroke="#7c3aed" stroke-width="1.5"/>
<text x="830" y="590" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">承認主体候補の承認</text>
<text x="830" y="608" text-anchor="middle" font-size="10" fill="#6b7280">+安全衛生部門等の関与</text>

<line x1="400" y1="620" x2="400" y2="656" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="410" y="642" font-size="10" fill="#6b7280">なし</text>

<rect x="150" y="656" width="500" height="52" rx="8" fill="#6b7280" opacity="0.12" stroke="#6b7280" stroke-width="1.5"/>
<text x="400" y="688" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">承認主体候補の単独承認で完結</text>

<text x="150" y="748" font-size="12" fill="#6b7280">※ 判定材料が「不明」の場合は、必ず保守側(重いルート)に倒す。Q2'は確定後の再判定でルートを軽くできる。</text>
<text x="150" y="770" font-size="12" fill="#6b7280">※ 投資規模・継続コスト負担部門は、上記いずれの結果でも最終決裁者(部長/役員会等)の階層を決める</text>
<text x="150" y="790" font-size="12" fill="#6b7280">　 別軸として、既存の稟議規程と組み合わせて適用する。</text>

<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
</marker>
</defs>
</svg>
