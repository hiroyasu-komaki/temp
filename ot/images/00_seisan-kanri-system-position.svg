<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img">
<title>「生産管理システム」はどこを指すか</title>
<desc>ERPとMESの機能をまたいで「生産管理システム」という言葉が実務上どの範囲を指すかを示す図。ERPの生産計画・MRP・発注・在庫管理と、MESの一部機能である進捗管理・作業実績集計が該当し、専用MESが担う設備連携やトレーサビリティは対象外となることが多い。</desc>
<rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

<text x="500" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">「生産管理システム」はISA-95のどこを指すか</text>

<text x="150" y="62" font-size="14" font-weight="700" fill="#2563eb">ERP(Level 4)</text>
<rect x="150" y="70" width="560" height="150" rx="8" fill="none" stroke="#2563eb" stroke-width="1.5"/>

<rect x="154" y="74" width="552" height="72" rx="6" fill="#d97706" opacity="0.15" stroke="#d97706" stroke-width="1.5"/>
<text x="172" y="96" font-size="12" font-weight="700" fill="#1a1a1a">生産管理システムの範囲</text>
<text x="172" y="116" font-size="11" fill="#6b7280">生産計画 / MRP(所要量計算) / 発注・購買 / 在庫管理</text>
<text x="172" y="134" font-size="10" fill="#6b7280" font-style="italic">例: mcframeの中核機能</text>

<rect x="154" y="150" width="552" height="66" rx="6" fill="#6b7280" opacity="0.10" stroke="#6b7280" stroke-width="1"/>
<text x="172" y="172" font-size="12" font-weight="700" fill="#6b7280">対象外(別システムが担う)</text>
<text x="172" y="192" font-size="11" fill="#6b7280">会計 / 人事給与 / CRM 等</text>

<text x="150" y="242" font-size="14" font-weight="700" fill="#6b7280">MES(Level 3)</text>
<rect x="150" y="250" width="560" height="150" rx="8" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>

<rect x="154" y="254" width="552" height="72" rx="6" fill="#d97706" opacity="0.08" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="172" y="276" font-size="12" font-weight="700" fill="#1a1a1a">含まれることもある(拡張導入時)</text>
<text x="172" y="296" font-size="11" fill="#6b7280">進捗管理 / 作業実績集計 / 出来高管理</text>

<rect x="154" y="330" width="552" height="66" rx="6" fill="#6b7280" opacity="0.10" stroke="#6b7280" stroke-width="1"/>
<text x="172" y="352" font-size="12" font-weight="700" fill="#6b7280">対象外(専用MESの領域)</text>
<text x="172" y="372" font-size="11" fill="#6b7280">設備連携(PLC通信) / リアルタイムトレーサビリティ</text>
<text x="172" y="388" font-size="11" fill="#6b7280">SPC・品質管理 / アンドン</text>

<path d="M 720 78 L 735 78 L 735 320 L 720 320" stroke="#d97706" stroke-width="2" fill="none"/>
<text x="820" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#d97706" transform="rotate(-90 820 200)">いわゆる「生産管理システム」の実務上の範囲</text>

<text x="150" y="430" font-size="12" fill="#6b7280">※ 国内の生産管理パッケージは、ERPの生産関連機能を核に、MESの一部(進捗・実績)まで拡張してカバーすることが多い。</text>
<text x="150" y="450" font-size="12" fill="#6b7280">設備連携やリアルタイムトレーサビリティなど厳密な意味でのMES機能は、専用MES/SCADAが別途担うのが一般的。</text>
</svg>
