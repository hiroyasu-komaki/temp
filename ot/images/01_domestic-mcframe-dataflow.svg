<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" role="img">
<title>国内:mcframe製品群におけるデータのやり取り</title>
<desc>mcframe ERPとmcframe MES間、mcframe MESとSCADA間のデータの流れを示す図。下向きは指示系データ(製造指図・作業BOM・生産計画・作業指示)、上向きは実績系データ(生産実績・工数実績・設備稼働実績)。</desc>
<rect x="0" y="0" width="900" height="600" fill="#ffffff"/>

<text x="450" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">国内: mcframe製品群におけるデータのやり取り</text>

<rect x="100" y="60" width="700" height="110" rx="8" fill="#2563eb" opacity="0.14" stroke="#2563eb" stroke-width="1.5"/>
<text x="120" y="92" font-size="15" font-weight="700" fill="#1a1a1a">mcframe ERP(基幹)</text>
<text x="120" y="114" font-size="11" fill="#6b7280">生産計画・MRP・発注・在庫管理・原価管理</text>
<text x="780" y="92" text-anchor="end" font-size="11" font-weight="700" fill="#2563eb">IT部門</text>

<line x1="300" y1="176" x2="300" y2="222" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<text x="320" y="188" font-size="11" font-weight="700" fill="#1a1a1a">指示系 ↓</text>
<text x="320" y="204" font-size="10" fill="#6b7280">製造指図/作業BOM</text>
<text x="320" y="218" font-size="10" fill="#6b7280">生産計画(日程)</text>

<line x1="600" y1="222" x2="600" y2="176" stroke="#6b7280" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="580" y="188" text-anchor="end" font-size="11" font-weight="700" fill="#1a1a1a">↑ 実績系</text>
<text x="580" y="204" text-anchor="end" font-size="10" fill="#6b7280">生産実績/工数実績</text>
<text x="580" y="218" text-anchor="end" font-size="10" fill="#6b7280">在庫消費実績</text>

<rect x="100" y="230" width="700" height="110" rx="8" fill="#d97706" opacity="0.15" stroke="#d97706" stroke-width="1.5"/>
<text x="120" y="262" font-size="15" font-weight="700" fill="#1a1a1a">mcframe MES(製造実行)</text>
<text x="120" y="284" font-size="11" fill="#6b7280">作業指示展開・実績収集・進捗管理</text>
<text x="120" y="302" font-size="10" fill="#6b7280" font-style="italic">※オプションモジュール。導入状況は要確認</text>
<text x="780" y="262" text-anchor="end" font-size="11" font-weight="700" fill="#d97706">IT部門/生産IT(協働)</text>

<line x1="300" y1="346" x2="300" y2="392" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<text x="320" y="358" font-size="11" font-weight="700" fill="#1a1a1a">指示系 ↓</text>
<text x="320" y="374" font-size="10" fill="#6b7280">作業指示</text>
<text x="320" y="388" font-size="10" fill="#6b7280">設定値(レシピ)</text>

<line x1="600" y1="392" x2="600" y2="346" stroke="#6b7280" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="580" y="358" text-anchor="end" font-size="11" font-weight="700" fill="#1a1a1a">↑ 実績系</text>
<text x="580" y="374" text-anchor="end" font-size="10" fill="#6b7280">設備稼働実績</text>
<text x="580" y="388" text-anchor="end" font-size="10" fill="#6b7280">アラーム・プロセスデータ</text>

<rect x="100" y="400" width="700" height="110" rx="8" fill="#16a34a" opacity="0.14" stroke="#16a34a" stroke-width="1.5"/>
<text x="120" y="432" font-size="15" font-weight="700" fill="#1a1a1a">SCADA(工場設備監視)</text>
<text x="120" y="454" font-size="11" fill="#6b7280">例: 横河電機, 富士電機 等</text>
<text x="780" y="432" text-anchor="end" font-size="11" font-weight="700" fill="#16a34a">生産IT</text>

<text x="100" y="545" font-size="12" fill="#6b7280">※ mcframeはERPを中核とし、MESオプションの導入有無・SCADAとの接続方式は拠点により異なる可能性がある。</text>
<text x="100" y="565" font-size="12" fill="#6b7280">実際の構成は生産ITへの確認を推奨。</text>

<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
</marker>
</defs>
</svg>
