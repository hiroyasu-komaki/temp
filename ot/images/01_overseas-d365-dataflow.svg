<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" role="img">
<title>海外:D365 + サードパーティMESにおけるデータのやり取り(想定)</title>
<desc>D365 Supply Chain ManagementとサードパーティMES(詳細不明)間、MESとSCADA/設備(詳細不明)間の想定データフローを示す図。実際の構成は現地生産ITへの確認が必要。</desc>
<rect x="0" y="0" width="900" height="600" fill="#ffffff"/>

<text x="450" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">海外: D365 + サードパーティMESにおけるデータのやり取り(想定)</text>

<rect x="100" y="60" width="700" height="110" rx="8" fill="#2563eb" opacity="0.14" stroke="#2563eb" stroke-width="1.5"/>
<text x="120" y="92" font-size="15" font-weight="700" fill="#1a1a1a">D365 Supply Chain Management(ERP)</text>
<text x="120" y="114" font-size="11" fill="#6b7280">生産計画・MRP・発注・在庫管理・生産フロア実行(一部標準機能)</text>
<text x="780" y="92" text-anchor="end" font-size="11" font-weight="700" fill="#2563eb">IT部門</text>

<line x1="300" y1="176" x2="300" y2="222" stroke="#6b7280" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="320" y="188" font-size="11" font-weight="700" fill="#1a1a1a">指示系(想定) ↓</text>
<text x="320" y="204" font-size="10" fill="#6b7280">製造指図(Production Order)</text>
<text x="320" y="218" font-size="10" fill="#6b7280">BOM/生産計画</text>

<line x1="600" y1="222" x2="600" y2="176" stroke="#6b7280" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="580" y="188" text-anchor="end" font-size="11" font-weight="700" fill="#1a1a1a">↑ 実績系(想定)</text>
<text x="580" y="204" text-anchor="end" font-size="10" fill="#6b7280">生産実績</text>
<text x="580" y="218" text-anchor="end" font-size="10" fill="#6b7280">在庫消費実績</text>

<rect x="100" y="230" width="700" height="110" rx="8" fill="#d97706" opacity="0.10" stroke="#d97706" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="120" y="262" font-size="15" font-weight="700" fill="#1a1a1a">MES(サードパーティ・詳細不明)</text>
<text x="120" y="284" font-size="11" fill="#6b7280">候補: Critical Manufacturing / Opcenter / AVEVA 等(未確認)</text>
<text x="120" y="302" font-size="10" fill="#6b7280" font-style="italic">※現地の生産ITへの確認が必要</text>
<text x="780" y="262" text-anchor="end" font-size="11" font-weight="700" fill="#d97706">生産IT(想定)</text>

<line x1="300" y1="346" x2="300" y2="392" stroke="#6b7280" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="320" y="358" font-size="11" font-weight="700" fill="#1a1a1a">指示系(想定) ↓</text>
<text x="320" y="374" font-size="10" fill="#6b7280">作業指示</text>
<text x="320" y="388" font-size="10" fill="#6b7280">設定値(レシピ)</text>

<line x1="600" y1="392" x2="600" y2="346" stroke="#6b7280" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="580" y="358" text-anchor="end" font-size="11" font-weight="700" fill="#1a1a1a">↑ 実績系(想定)</text>
<text x="580" y="374" text-anchor="end" font-size="10" fill="#6b7280">設備稼働実績</text>
<text x="580" y="388" text-anchor="end" font-size="10" fill="#6b7280">アラーム等</text>

<rect x="100" y="400" width="700" height="110" rx="8" fill="#16a34a" opacity="0.10" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="120" y="432" font-size="15" font-weight="700" fill="#1a1a1a">SCADA/設備(詳細不明)</text>
<text x="120" y="454" font-size="11" fill="#6b7280">現地設備・PLCベンダー不明</text>
<text x="780" y="432" text-anchor="end" font-size="11" font-weight="700" fill="#16a34a">生産IT(想定)</text>

<text x="100" y="545" font-size="12" fill="#6b7280">※ 海外拠点のMES/SCADA構成は未確認。図中の接続は一般的なデータ連携パターンの想定であり、</text>
<text x="100" y="565" font-size="12" fill="#6b7280">実際の有無・方式は現地生産ITへの確認が必要。</text>

<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
</marker>
</defs>
</svg>
