<svg viewBox="0 0 1040 660" xmlns="http://www.w3.org/2000/svg" role="img">
<title>製造業ITアーキテクチャの全体像(ISA-95モデル) — IT部門・生産ITの守備範囲</title>
<desc>ERP・MES・SCADA・PLC・フィールド機器の5階層に、IT部門と生産ITの担当範囲を縦にオーバーラップさせた図。ERPは完全にIT部門、SCADA以下は完全に生産ITが担当し、MES層のみ両者が上下で分担・重なる。</desc>
<rect x="0" y="0" width="1040" height="660" fill="#ffffff"/>

<text x="520" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">製造業ITアーキテクチャの全体像(ISA-95モデル)— IT部門・生産ITの守備範囲</text>

<rect x="380" y="42" width="14" height="14" fill="#2563eb" opacity="0.25" stroke="#2563eb"/>
<text x="400" y="53" font-size="11" fill="#6b7280">IT部門の守備範囲</text>
<rect x="540" y="42" width="14" height="14" fill="#16a34a" opacity="0.25" stroke="#16a34a"/>
<text x="560" y="53" font-size="11" fill="#6b7280">生産ITの守備範囲</text>

<path d="M 75 80 L 60 80 L 60 225 L 75 225" stroke="#2563eb" stroke-width="2" fill="none"/>
<text x="42" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#2563eb" transform="rotate(-90 42 152)">IT部門の守備範囲</text>

<path d="M 75 235 L 60 235 L 60 554 L 75 554" stroke="#16a34a" stroke-width="2" fill="none"/>
<text x="42" y="394" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a" transform="rotate(-90 42 394)">生産ITの守備範囲</text>

<rect x="130" y="80" width="680" height="90" rx="8" fill="#2563eb" opacity="0.14" stroke="#2563eb" stroke-width="1.5"/>
<text x="150" y="106" font-size="15" font-weight="700" fill="#1a1a1a">ERP(Level 4)</text>
<text x="150" y="126" font-size="11" fill="#6b7280">受注・生産計画・会計・購買</text>
<text x="150" y="144" font-size="11" fill="#6b7280">例: SAP, Oracle, mcframe</text>
<text x="790" y="106" text-anchor="end" font-size="11" font-weight="700" fill="#2563eb">IT部門</text>
<text x="790" y="126" text-anchor="end" font-size="11" fill="#6b7280">週〜月単位</text>

<text x="150" y="197" font-size="11" fill="#6b7280" font-weight="700">MES(Level 3)</text>
<text x="790" y="197" text-anchor="end" font-size="11" fill="#6b7280">日〜時間単位</text>

<rect x="130" y="180" width="680" height="45" rx="6" fill="#2563eb" opacity="0.14" stroke="#2563eb" stroke-width="1.5"/>
<text x="150" y="207" font-size="12" fill="#1a1a1a">標準機能・ERP連携・全社マスタ</text>
<text x="790" y="207" text-anchor="end" font-size="11" font-weight="700" fill="#2563eb">IT部門</text>

<rect x="130" y="225" width="680" height="45" rx="6" fill="#16a34a" opacity="0.14" stroke="#16a34a" stroke-width="1.5"/>
<text x="150" y="252" font-size="12" fill="#1a1a1a">工場固有カスタマイズ・MES/OT接続</text>
<text x="790" y="252" text-anchor="end" font-size="11" font-weight="700" fill="#16a34a">生産IT</text>

<line x1="130" y1="225" x2="810" y2="225" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="815" y="229" font-size="10" fill="#6b7280">← 協働ゾーン</text>

<rect x="130" y="280" width="680" height="90" rx="8" fill="#16a34a" opacity="0.14" stroke="#16a34a" stroke-width="1.5"/>
<text x="150" y="306" font-size="15" font-weight="700" fill="#1a1a1a">SCADA / HMI(Level 2)</text>
<text x="150" y="326" font-size="11" fill="#6b7280">設備状態監視・パラメータ設定</text>
<text x="150" y="344" font-size="11" fill="#6b7280">例: 横河電機, 富士電機, AVEVA, WinCC</text>
<text x="790" y="306" text-anchor="end" font-size="11" font-weight="700" fill="#16a34a">生産IT</text>
<text x="790" y="326" text-anchor="end" font-size="11" fill="#6b7280">秒〜分単位</text>

<rect x="130" y="380" width="680" height="90" rx="8" fill="#16a34a" opacity="0.14" stroke="#16a34a" stroke-width="1.5"/>
<text x="150" y="406" font-size="15" font-weight="700" fill="#1a1a1a">PLC / DCS(Level 1)</text>
<text x="150" y="426" font-size="11" fill="#6b7280">機器のシーケンス制御・直接制御</text>
<text x="150" y="444" font-size="11" fill="#6b7280">例: 三菱電機, オムロン, Siemens, Rockwell</text>
<text x="790" y="406" text-anchor="end" font-size="11" font-weight="700" fill="#16a34a">生産IT</text>
<text x="790" y="426" text-anchor="end" font-size="11" fill="#6b7280">ms〜秒単位</text>

<rect x="130" y="480" width="680" height="74" rx="8" fill="#16a34a" opacity="0.14" stroke="#16a34a" stroke-width="1.5"/>
<text x="150" y="508" font-size="15" font-weight="700" fill="#1a1a1a">フィールド機器(Level 0)</text>
<text x="150" y="528" font-size="11" fill="#6b7280">センサー・アクチュエータ・物理プロセス</text>
<text x="790" y="508" text-anchor="end" font-size="11" font-weight="700" fill="#16a34a">生産IT</text>
<text x="790" y="528" text-anchor="end" font-size="11" fill="#6b7280">リアルタイム</text>

<text x="130" y="600" font-size="12" fill="#6b7280">※ ERPは完全にIT部門、SCADA以下は完全に生産ITの守備範囲。両者が重なるのはMES層のみで、</text>
<text x="130" y="620" font-size="12" fill="#6b7280">ERP連携・標準機能側はIT部門、工場固有カスタマイズ・OT接続側は生産ITが担当する。</text>
</svg>
