<svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Level3(MOM)の4領域と代表システム</title>
<desc>ISA-95のLevel3はMOM(製造オペレーション管理)として、生産・品質・保全・在庫の4領域に分かれる。それぞれをMES、LIMS/QMS、CMMS/EAM、WMSが担い、MESA-11の11機能はこの4領域を横断することを示す図。</desc>
<rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>

<text x="500" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Level3(MOM)の4領域と、それぞれを担うシステム</text>

<rect x="80" y="56" width="840" height="52" rx="8" fill="#2563eb" opacity="0.12" stroke="#2563eb" stroke-width="1.5"/>
<text x="100" y="80" font-size="14" font-weight="700" fill="#1a1a1a">Level 4:ERP</text>
<text x="100" y="99" font-size="11" fill="#6b7280">受注・生産計画・会計・購買(mcframe / D365)</text>
<text x="900" y="90" text-anchor="end" font-size="11" fill="#6b7280">週〜月単位</text>

<line x1="500" y1="108" x2="500" y2="136" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrowStart)"/>

<rect x="80" y="136" width="840" height="204" rx="8" fill="#f3f4f6" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="100" y="164" font-size="14" font-weight="700" fill="#1a1a1a">Level 3:MOM(製造オペレーション管理)</text>
<text x="900" y="164" text-anchor="end" font-size="11" fill="#6b7280">日〜時間単位</text>

<rect x="100" y="180" width="188" height="140" rx="6" fill="#2563eb" opacity="0.12" stroke="#2563eb" stroke-width="1.5"/>
<text x="194" y="204" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">生産オペレーション管理</text>
<text x="194" y="230" text-anchor="middle" font-size="15" font-weight="700" fill="#2563eb">MES</text>
<text x="194" y="256" text-anchor="middle" font-size="10" fill="#6b7280">作業指示・ディスパッチ</text>
<text x="194" y="272" text-anchor="middle" font-size="10" fill="#6b7280">実績収集・進捗追跡</text>
<line x1="118" y1="286" x2="270" y2="286" stroke="#2563eb" stroke-width="1" opacity="0.4"/>
<text x="194" y="304" text-anchor="middle" font-size="9" fill="#6b7280">MESA-11: 2,3,4,5,6,8,10,11</text>

<rect x="304" y="180" width="188" height="140" rx="6" fill="#16a34a" opacity="0.12" stroke="#16a34a" stroke-width="1.5"/>
<text x="398" y="204" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">品質オペレーション管理</text>
<text x="398" y="230" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">LIMS / QMS</text>
<text x="398" y="256" text-anchor="middle" font-size="10" fill="#6b7280">検査計画・試験結果収集</text>
<text x="398" y="272" text-anchor="middle" font-size="10" fill="#6b7280">SPC・逸脱管理</text>
<line x1="322" y1="286" x2="474" y2="286" stroke="#16a34a" stroke-width="1" opacity="0.4"/>
<text x="398" y="304" text-anchor="middle" font-size="9" fill="#6b7280">MESA-11: 7</text>

<rect x="508" y="180" width="188" height="140" rx="6" fill="#d97706" opacity="0.12" stroke="#d97706" stroke-width="1.5"/>
<text x="602" y="204" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">保全オペレーション管理</text>
<text x="602" y="230" text-anchor="middle" font-size="15" font-weight="700" fill="#d97706">CMMS / EAM</text>
<text x="602" y="256" text-anchor="middle" font-size="10" fill="#6b7280">保全作業指示・予防保全</text>
<text x="602" y="272" text-anchor="middle" font-size="10" fill="#6b7280">故障・停止分析</text>
<line x1="526" y1="286" x2="678" y2="286" stroke="#d97706" stroke-width="1" opacity="0.4"/>
<text x="602" y="304" text-anchor="middle" font-size="9" fill="#6b7280">MESA-11: 9</text>

<rect x="712" y="180" width="188" height="140" rx="6" fill="#7c3aed" opacity="0.12" stroke="#7c3aed" stroke-width="1.5"/>
<text x="806" y="204" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">在庫オペレーション管理</text>
<text x="806" y="230" text-anchor="middle" font-size="15" font-weight="700" fill="#7c3aed">WMS</text>
<text x="806" y="256" text-anchor="middle" font-size="10" fill="#6b7280">資材・仕掛の移動</text>
<text x="806" y="272" text-anchor="middle" font-size="10" fill="#6b7280">ロケーション・在庫数量</text>
<line x1="730" y1="286" x2="882" y2="286" stroke="#7c3aed" stroke-width="1" opacity="0.4"/>
<text x="806" y="304" text-anchor="middle" font-size="9" fill="#6b7280">MESA-11: 1(資材)</text>

<line x1="500" y1="340" x2="500" y2="368" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrowStart)"/>

<rect x="80" y="368" width="840" height="52" rx="8" fill="#6b7280" opacity="0.12" stroke="#6b7280" stroke-width="1.5"/>
<text x="100" y="392" font-size="14" font-weight="700" fill="#1a1a1a">Level 2〜0:SCADA/HMI・PLC/DCS・フィールド機器</text>
<text x="100" y="411" font-size="11" fill="#6b7280">設備状態監視・シーケンス制御・センサー/アクチュエータ</text>
<text x="900" y="402" text-anchor="end" font-size="11" fill="#6b7280">秒〜ミリ秒単位</text>

<text x="80" y="452" font-size="12" fill="#6b7280">※ 4領域はいずれも同じ活動モデル(定義管理・資源管理・詳細スケジューリング・ディスパッチ・実行・データ収集・追跡・分析)を持つ。</text>
<text x="80" y="472" font-size="12" fill="#6b7280">※ MESA-11の11機能は4領域を横断するため、MES単体で11機能すべてを満たすことは通常ない。カバレッジの空白は</text>
<text x="80" y="492" font-size="12" fill="#6b7280">　 「MESの機能不足」ではなく「担当するL3システムの不在」として読む。</text>

<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
</marker>
<marker id="arrowStart" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
<path d="M8,0 L0,4 L8,8 Z" fill="#6b7280"/>
</marker>
</defs>
</svg>
